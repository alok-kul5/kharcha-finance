name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # AGP 9 lint needs JDK 21

      # Caches Gradle and Android dependencies between runs: faster builds,
      # and no Maven Central rate limits from re-downloading everything.
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/data/database.g.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Sync stays off unless the repository has these secrets; the app is
      # fully usable without them.
      # A universal APK (every ABI) and small per-ABI APKs. Most phones want
      # the arm64 one.
      - name: Build release APKs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          flutter build apk --release $DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk universal.apk
          flutter build apk --release --split-per-abi $DEFINES

      - name: Name APKs
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          out=build/app/outputs/flutter-apk
          mv universal.apk "kharcha-$VERSION-universal.apk"
          cp "$out/app-arm64-v8a-release.apk" "kharcha-$VERSION-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "kharcha-$VERSION-armv7.apk"
          cp "$out/app-x86_64-release.apk" "kharcha-$VERSION-x86_64.apk"
          ls -l kharcha-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kharcha-apk
          path: kharcha-*.apk
          if-no-files-found: error

  web:
    name: Build web demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /kharcha-finance/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kharcha-apk

      - name: Release notes with download sizes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          size() { numfmt --to=si --suffix=B --format='%.1f' "$(stat -c %s "$1")"; }
          {
            echo "## Download"
            echo
            echo "| APK | For | Size |"
            echo "|---|---|---|"
            echo "| **kharcha-$VERSION-arm64.apk** | Almost every phone from the last several years (64-bit ARM). **Start here.** | $(size kharcha-$VERSION-arm64.apk) |"
            echo "| kharcha-$VERSION-armv7.apk | Older 32-bit ARM phones | $(size kharcha-$VERSION-armv7.apk) |"
            echo "| kharcha-$VERSION-x86_64.apk | x86_64 emulators and Chromebooks | $(size kharcha-$VERSION-x86_64.apk) |"
            echo "| kharcha-$VERSION-universal.apk | Any device (every ABI in one file) | $(size kharcha-$VERSION-universal.apk) |"
            echo
            echo "Android 7.0 or later. Sideload it: allow installs from your browser or file manager, then open the APK."
            echo "The APK is signed with a CI key, so uninstall an older build before installing this one."
            echo "The on-device Gemma model (about 550 MB) is downloaded later from Settings, only if you want it."
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: kharcha-*.apk
          body_path: notes.md
          generate_release_notes: true
