name: kharcha
description: "Kharcha: offline-first personal finance with on-device AI."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # UI
  material_ui: ^1.1.0
  cupertino_ui: ^1.1.7
  fl_chart: ^1.3.1
  intl: ^0.20.3
  # State and storage
  flutter_riverpod: ^3.5.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  # On-device AI and OCR
  flutter_edge_ai: ^2.6.0
  flutter_edge_ai_mediapipe: ^1.3.0
  google_mlkit_text_recognition: ^1.0.3
  image_picker: ^1.2.4
  # Device
  flutter_local_notifications: ^23.0.3
  permission_handler: ^13.0.2
  # Optional sync
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: Gloock
      fonts:
        - asset: assets/fonts/Gloock.ttf
